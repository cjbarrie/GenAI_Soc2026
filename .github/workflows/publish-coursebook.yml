name: Build and publish course book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COURSE_HOSTED_MODEL: openai/gpt-5.2
      COURSE_LOCAL_MODEL: gemma4:e2b-it-qat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.3"
          enable-cache: true

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.7.32"
          tinytex: true

      - name: Install Python environment
        run: uv sync --frozen

      - name: Validate source chapters, citations, notebooks and tasks
        run: |
          uv run python scripts/check_coursebook.py
          uv run python scripts/check_course.py
          uv run python scripts/integration_check.py
          uv run python scripts/check_citations.py

      - name: Test recorded fixtures and offline course logic
        run: uv run pytest -q

      - name: Build downloadable PDF edition
        run: quarto render coursebook --to pdf

      - name: Preserve the PDF while Quarto builds the HTML tree
        run: cp coursebook/_book/Generative-AI-in-Sociology.pdf /tmp/Generative-AI-in-Sociology.pdf

      - name: Build searchable HTML edition
        run: quarto render coursebook --to html

      - name: Add the PDF download to the published site
        run: cp /tmp/Generative-AI-in-Sociology.pdf coursebook/_book/Generative-AI-in-Sociology.pdf

      - name: Validate packaged HTML resources
        run: uv run python scripts/check_coursebook.py --rendered

      - name: Check that the PDF exists
        run: test -s coursebook/_book/Generative-AI-in-Sociology.pdf

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: coursebook/_book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
